name: build

# Push a version tag (v0.4.1) to build the AppImage and attach it to a
# GitHub release. Run it by hand from the Actions tab (Run workflow) to get
# the AppImage as a downloadable artifact without making a release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tests:
    uses: ./.github/workflows/tests.yml

  appimage:
    needs: tests
    # an older base keeps the glibc floor low, since pip picks wheels to
    # match the machine it runs on
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Version from the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          v="${GITHUB_REF_NAME#v}"
          sed -i "s/^__version__ = .*/__version__ = \"$v\"/" epochcolor/_version.py
          grep __version__ epochcolor/_version.py

      - name: Build
        run: bash packaging/appimage/build.sh

      - name: Smoke test the AppImage
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libfontconfig1 libdbus-1-3
          A="$(ls dist/*.AppImage)"
          run() { "$A" --appimage-extract-and-run "$@"; }
          export EPOCHCOLOR_CACHE="$RUNNER_TEMP/cache"
          run --version
          run encoders
          run models
          run setup-torch --check
          # a photo through the whole pipeline, with the bundled ffmpeg making the inputs
          cd "$RUNNER_TEMP"
          "$GITHUB_WORKSPACE/$A" --appimage-extract >/dev/null
          squashfs-root/usr/bin/ffmpeg -hide_banner -loglevel error -f lavfi -i testsrc2=s=320x240 \
            -frames:v 1 -pix_fmt gray -y in.png
          squashfs-root/usr/bin/ffmpeg -hide_banner -loglevel error -f lavfi -i testsrc2=s=320x240:d=1 \
            -f lavfi -i sine=d=1 -pix_fmt yuv420p -c:v libx264 -c:a flac -shortest -y clip.mkv
          "$GITHUB_WORKSPACE/$A" --appimage-extract-and-run photo in.png -m hints -o out.png
          test -s out.png
          "$GITHUB_WORKSPACE/$A" --appimage-extract-and-run video clip.mkv --probe
          # the editor starts, and its worker process imports the clip
          QT_QPA_PLATFORM=offscreen EPOCHCOLOR_NO_FIRST_RUN=1 timeout 25 \
            "$GITHUB_WORKSPACE/$A" --appimage-extract-and-run clip.mkv || test $? -eq 124
          ls "$EPOCHCOLOR_CACHE/media"/*/proxy.mp4

      - uses: actions/upload-artifact@v4
        with:
          name: EpochColor-AppImage
          path: dist/*.AppImage
          if-no-files-found: error

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.AppImage
          generate_release_notes: true
