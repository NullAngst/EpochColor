name: tests

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_call:  # the build workflow runs these first

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[test,raw,gui]"
      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -q
